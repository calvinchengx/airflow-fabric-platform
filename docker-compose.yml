# The platform: Apache Airflow 3 + a Fabric target. Names no product.
#
# The product arrives two ways, and they are DIFFERENT MECHANISMS that people
# routinely conflate:
#
#   its DAG FILES      -> a bundle (bind mount here, GitDagBundle in production)
#   its DEPENDENCIES   -> uv pip install of its pyproject.toml into the worker
#
# The bundle delivers files and installs nothing. A product whose DAGs import a
# library the worker lacks parses fine and fails at run time.
services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16}
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 3s
      retries: 20

  entra-emulator:
    image: ghcr.io/calvinchengx/entra-emulator:${ENTRA_EMULATOR_VERSION:?see versions.env}
    environment:
      ORIGIN_MODE: compat
      TLS_ENABLED: "false"
      PORT: "8443"
      PUBLIC_ORIGIN: "http://entra-emulator:8443"
    healthcheck:
      test: ["CMD", "/usr/local/bin/entra-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  # The Warehouse's storage engine. Fabric's Warehouse speaks TDS, and the
  # emulator terminates that protocol against a real SQL Server rather than
  # reimplementing it -- which is why dbt-fabric and two other driver families
  # can drive it unmodified. In production this service does not exist: the
  # Warehouse is Fabric's own.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:${MSSQL_VERSION:-2022-latest}
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Str0ng!Passw0rd}"
      MSSQL_MEMORY_LIMIT_MB: "2048"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa",
             "-P", "${MSSQL_SA_PASSWORD:-Str0ng!Passw0rd}", "-C", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # The Fabric target. In production this service does not exist and the
  # connections point at real Fabric instead; nothing else differs.
  fabric-emulator:
    image: ghcr.io/calvinchengx/fabric-emulator:${FABRIC_EMULATOR_VERSION:?see versions.env}@${FABRIC_EMULATOR_DIGEST:?see versions.env}
    depends_on:
      entra-emulator: {condition: service_healthy}
      sqlserver: {condition: service_healthy}
    # TLS, ON. Real Fabric is HTTPS-only, and plain HTTP was a shortcut Phase 1
    # got away with: dbt-fabricspark refuses a non-HTTPS endpoint outright
    # ("endpoint must use HTTPS, got: http://..."). Serving TLS also exercises
    # the target's `verify_tls` seam, which a plain-HTTP platform never does.
    #
    # The cert is self-signed with SAN api.fabric.microsoft.com and PERSISTED to
    # a volume, so every client can trust the same file. FABRIC_DATA_DIR is what
    # makes it survive a restart -- without it each boot mints a new cert and
    # every client's trust store is stale.
    environment:
      FABRIC_ADDR: ":9443"
      FABRIC_DATA_DIR: "/data"
      # The Warehouse surface. Without these the emulator serves no TDS at all
      # and dbt-fabric has nothing to connect to -- silver and gold would have
      # nowhere to materialise.
      FABRIC_SQL_TDS_ADDR: ":1433"
      # Where Livy statements go. Without it the emulator terminates Livy and
      # has nothing to execute them, so dbt-fabricspark connects and every
      # model fails.
      FABRIC_SPARK_AGENT_URL: "http://spark-agent:8099"
      FABRIC_WAREHOUSE_SQL_URL: "server=sqlserver;user id=sa;password=${MSSQL_SA_PASSWORD:-Str0ng!Passw0rd};encrypt=disable;dial timeout=90;connection timeout=90"
      FABRIC_ENTRA_ISSUER: "http://entra-emulator:8443/${ENTRA_TENANT:-6f89cf12-978b-4d23-ac18-9ef0c127cf87}/v2.0"
    volumes:
      - emu-data:/data
    networks:
      default:
        # ADDRESSED BY ITS PRODUCTION HOSTNAME, which is the cert's SAN. The
        # same thing `curl --resolve` does: clients use the real Fabric name and
        # DNS inside the compose network points it here. Nothing in the product
        # has to know it is talking to an emulator.
        aliases:
          - api.fabric.microsoft.com
          - onelake.dfs.fabric.microsoft.com
    healthcheck:
      test: ["CMD", "/usr/local/bin/fabric-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

  # THE TARGET'S COMPUTE. dbt-fabricspark does not run Spark in the Airflow
  # worker -- it submits to Livy, the emulator drives the statement agent, and
  # the agent executes on Sail over Spark Connect. So the worker stays
  # Spark-free while silver is still built by a real engine.
  sail:
    image: ghcr.io/calvinchengx/emulator-sail:${SAIL_ENGINE_VERSION:?see versions.env}@${SAIL_ENGINE_DIGEST:?see versions.env}
    depends_on:
      fabric-emulator: {condition: service_healthy}
    environment:
      ENTRA_TOKEN_URL: "http://entra-emulator:8443/${ENTRA_TENANT:-6f89cf12-978b-4d23-ac18-9ef0c127cf87}/oauth2/v2.0/token"
      ENTRA_CLIENT_ID: "${ENTRA_CLIENT_ID:-00d88624-f0d7-46f6-a641-6232c2608928}"
      ENTRA_CLIENT_SECRET: "${ENTRA_CLIENT_SECRET:-daemon-app-secret}"
      AZURE_STORAGE_ACCOUNT_NAME: "onelake"
      AZURE_STORAGE_ENDPOINT: "https://fabric-emulator:9443/onelake"
      # The emulator's cert is self-signed and object_store has no CA bundle
      # option; this is the documented seam for it.
      AZURE_ALLOW_INVALID_CERTIFICATES: "true"
      SAIL_SPARK__SESSION_TIMEOUT_SECS: "3600"

  spark-agent:
    image: ghcr.io/calvinchengx/emulator-spark-agent:${SPARK_CLIENT_VERSION:?see versions.env}@${SPARK_CLIENT_DIGEST:?see versions.env}
    depends_on:
      sail: {condition: service_started}
    environment:
      SPARK_REMOTE: "sc://sail:50051"
      ENTRA_TOKEN_URL: "http://entra-emulator:8443/${ENTRA_TENANT:-6f89cf12-978b-4d23-ac18-9ef0c127cf87}/oauth2/v2.0/token"
      ENTRA_CLIENT_ID: "${ENTRA_CLIENT_ID:-00d88624-f0d7-46f6-a641-6232c2608928}"
      ENTRA_CLIENT_SECRET: "${ENTRA_CLIENT_SECRET:-daemon-app-secret}"
      AZURE_STORAGE_ENDPOINT: "https://fabric-emulator:9443/onelake"
      AZURE_ALLOW_INVALID_CERTIFICATES: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8099/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40

  airflow:
    build:
      context: ${PRODUCT}/..
      dockerfile: ${PWD}/Dockerfile.worker
      args:
        AIRFLOW_VERSION: ${AIRFLOW_VERSION:-3.3.1}
        PRODUCT_DIR: ${PRODUCT_NAME:-product}
    depends_on:
      postgres: {condition: service_healthy}
      fabric-emulator: {condition: service_healthy}
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      # THE BUNDLE. Rooted at the product's `dags/` SUBDIRECTORY, which is the
      # production shape too -- GitDagBundle takes a subdir the same way.
      AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST: >-
        [{"name":"product","classpath":"airflow.dag_processing.bundles.local.LocalDagBundle","kwargs":{"path":"/opt/product/dags"}}]
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "5"
      # AIRFLOW 3 RUNS TASKS THROUGH THE API SERVER, not the metadata DB. A
      # stack without api-server fails every task with
      # `httpcore.ConnectError: [Errno 111] Connection refused` -- measured, on
      # the first run of this platform's own probe. This is the Task SDK
      # boundary made operational and it is a real break from Airflow 2.
      AIRFLOW__API__BASE_URL: "http://localhost:8080"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://localhost:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:-local-dev-not-a-secret}"
      # PINNED, and it has to be. Airflow INVENTS a Fernet key when none is set,
      # while postgres keeps the connections it encrypted with the previous one
      # -- so the first `make up` works and every one after it fails with
      # `cryptography.fernet.InvalidToken` on any stored credential. The symptom
      # is unprovisionable connections, which reads like a provisioning bug.
      # Production supplies its own key; this default is for local only and is
      # deliberately not a secret.
      AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-Zp8kRr7vQ2mN4xJ6wL9tY3bV5cX1aS0dF7gH8jK2lM4=}"
      # WHERE THE TARGET IS. The product reads these through a Connection and
      # never learns which target answered. In production they are absent and
      # the connection points at real Fabric.
      FABRIC_API_ROOT: "https://api.fabric.microsoft.com:9443"
      FABRIC_ONELAKE_URL: "https://api.fabric.microsoft.com:9443"
      FABRIC_ONELAKE_HOST_HEADER: "onelake.dfs.fabric.microsoft.com"
      # THE SAME STORAGE OPTIONS THE `fabric` CONNECTION CARRIES, for the
      # environment constructor. A product witness builds its target from env
      # rather than from a Connection precisely so it can run outside a DAG --
      # and if the two constructors disagree, the witness stops exercising what
      # the DAG does, which is the one property that makes a witness worth
      # anything. Same values, stated once per route by this platform.
      FABRIC_STORAGE_OPTIONS: >-
        {"azure_endpoint": "https://api.fabric.microsoft.com:9443/onelake",
         "azure_allow_invalid_certificates": "true"}
      # The emulator's own cert, shared read-only. Every HTTPS client in the
      # worker -- requests, urllib, dbt -- trusts THIS file rather than
      # disabling verification, so the TLS path is genuinely exercised.
      # THE COMBINED BUNDLE start.sh writes: system CAs + the emulator's cert.
      # Named here rather than exported by start.sh because `docker compose
      # exec` starts a fresh process with the COMPOSE environment and inherits
      # nothing from the entrypoint -- so an exported-only value would be right
      # for tasks and wrong for anything run by hand.
      #
      # NOT the bare emulator cert: pointing at it alone REPLACES the system
      # store, and every public HTTPS call fails. Measured -- `dbt deps` could
      # not reach hub.getdbt.com with CERTIFICATE_VERIFY_FAILED.
      SSL_CERT_FILE: "/tmp/ca-bundle.pem"
      REQUESTS_CA_BUNDLE: "/tmp/ca-bundle.pem"
      FABRIC_CA_FILE: "/emu-data/tls/cert.pem"
      ENTRA_TOKEN_URL: "http://entra-emulator:8443/${ENTRA_TENANT:-6f89cf12-978b-4d23-ac18-9ef0c127cf87}/oauth2/v2.0/token"
      ENTRA_CLIENT_ID: "${ENTRA_CLIENT_ID:-00d88624-f0d7-46f6-a641-6232c2608928}"
      ENTRA_CLIENT_SECRET: "${ENTRA_CLIENT_SECRET:-daemon-app-secret}"
      FABRIC_TARGET: emulator
      SOURCES_DECL: /sources/sources.yaml
      # WHERE STATEMENTS GO, on the worker too -- not only on the emulator.
      # Bronze registers each Delta table with the engine's catalog through
      # this; without it silver's `source()` cannot resolve anything. It was
      # set on fabric-emulator alone, so the product read None and skipped
      # registration silently while the DAG stayed green.
      FABRIC_SPARK_AGENT_URL: "http://spark-agent:8099"
      # No ambient Azure credential chain. A component that cannot find its
      # credentials must FAIL, not fall through to DefaultAzureCredential and
      # authenticate against real Azure -- which is what dlt's built-in
      # destinations did during Phase 0, reaching real Microsoft endpoints with
      # the developer's own az login state.
      AZURE_CLIENT_ID: ""
      AZURE_TENANT_ID: ""
      AZURE_CLIENT_SECRET: ""
      MSI_ENDPOINT: ""
      IDENTITY_ENDPOINT: ""
    ports:
      - "${AIRFLOW_PORT:-18080}:8080"
    volumes:
      - ${PRODUCT:?set PRODUCT to a data product repo, or run via make up}:/opt/product:ro
      # The vendor declaration and their API keys. The platform reads a sources
      # repo to learn which Connections to provision; it never writes there.
      - ${SOURCES:?set SOURCES to a sources repo, or run via make up}:/sources:ro
      - emu-data:/emu-data:ro
    command: ["bash", "-lc", "/opt/platform/start.sh"]
    configs:
      - source: start_sh
        target: /opt/platform/start.sh
        mode: 0755

volumes:
  emu-data:

configs:
  start_sh:
    file: ./scripts/start.sh
